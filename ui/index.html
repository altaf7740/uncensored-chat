<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uncensored Chat</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #161a21; --panel2: #1d222b; --border: #2a303b;
    --text: #e6e8ec; --muted: #8b93a1; --accent: #d9534f; --accent2: #b8433f;
    --user: #232a35; --code: #0b0d11;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* sidebar */
  #side { width: 260px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  #side header { padding: 14px; display: flex; gap: 8px; }
  #newChat { flex: 1; background: var(--accent); border: 0; border-radius: 8px; padding: 9px; color: #fff; font-weight: 600; }
  #newChat:hover { background: var(--accent2); }
  #chats { flex: 1; overflow-y: auto; padding: 0 8px; }
  .chat-item { display: flex; align-items: center; border-radius: 8px; padding: 8px 10px; margin-bottom: 2px; cursor: pointer; color: var(--muted); }
  .chat-item:hover { background: var(--panel2); }
  .chat-item.active { background: var(--panel2); color: var(--text); }
  .chat-item span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .chat-item button { background: none; border: 0; color: var(--muted); padding: 0 4px; visibility: hidden; }
  .chat-item:hover button { visibility: visible; }
  .chat-item button:hover { color: var(--accent); }
  #settings { border-top: 1px solid var(--border); padding: 12px 14px; font-size: 13px; color: var(--muted); }
  #settings label { display: block; margin-bottom: 10px; }
  #settings textarea { width: 100%; height: 70px; resize: vertical; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 6px; margin-top: 4px; font-size: 13px; }
  #settings .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #settings input[type=range] { width: 110px; }
  #status { font-size: 12px; margin-top: 4px; }
  #status.ok::before { content: "● "; color: #4caf50; }
  #status.bad::before { content: "● "; color: var(--accent); }

  /* main */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar { display: none; padding: 10px 16px; border-bottom: 1px solid var(--border); align-items: center; gap: 10px; }
  #menu { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; }
  #log { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty h1 { color: var(--text); font-size: 28px; margin-bottom: 6px; }
  .msg { margin-bottom: 22px; }
  .msg.user .bubble { background: var(--user); border-radius: 14px; padding: 10px 14px; margin-left: auto; max-width: 85%; width: fit-content; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user img { display: block; max-width: 240px; max-height: 240px; border-radius: 8px; margin: 0 0 8px auto; }
  .msg.assistant .body { word-wrap: break-word; }
  .body p:first-child { margin-top: 0; }
  .body pre { background: var(--code); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; }
  .body code { font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .body :not(pre) > code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
  .body table { border-collapse: collapse; display: block; overflow-x: auto; }
  .body th, .body td { border: 1px solid var(--border); padding: 5px 10px; }
  .body a { color: #6ea8fe; }
  details.think { margin-bottom: 10px; color: var(--muted); font-size: 14px; border-left: 2px solid var(--border); padding-left: 12px; }
  details.think summary { cursor: pointer; user-select: none; }
  details.think div { white-space: pre-wrap; margin-top: 6px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 12px; }
  .meta button { background: none; border: 0; color: var(--muted); padding: 0; }
  .meta button:hover { color: var(--text); }
  .cursor::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }
  .error { color: var(--accent); }

  /* composer */
  #composer { padding: 12px 16px 18px; }
  #box { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 8px; }
  #box:focus-within { border-color: #3d4554; }
  #attachments { display: flex; gap: 8px; flex-wrap: wrap; }
  #attachments div { position: relative; }
  #attachments img { height: 64px; border-radius: 6px; display: block; }
  #attachments button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 12px; line-height: 20px; padding: 0; }
  #input { width: 100%; background: none; border: 0; outline: 0; resize: none; padding: 6px 8px; max-height: 240px; }
  #actions { display: flex; align-items: center; gap: 8px; }
  #actions .spacer { flex: 1; }
  .icon { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; color: var(--muted); font-size: 13px; }
  .icon:hover { color: var(--text); }
  .icon.on { color: var(--text); border-color: var(--accent); }
  #send { background: var(--accent); border: 0; border-radius: 8px; padding: 6px 16px; color: #fff; font-weight: 600; }
  #send:disabled { opacity: .4; cursor: default; }
  #send.stop { background: var(--panel2); border: 1px solid var(--border); }
  .hint { text-align: center; font-size: 11px; color: var(--muted); margin-top: 6px; }

  @media (max-width: 760px) {
    #side { position: fixed; inset: 0 auto 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; }
    #side.open { transform: none; box-shadow: 0 0 40px #000; }
    #topbar { display: flex; }
    #log { padding: 16px; }
  }
</style>
</head>
<body>
<aside id="side">
  <header><button id="newChat">+ New chat</button></header>
  <div id="chats"></div>
  <div id="settings">
    <label>System prompt
      <textarea id="system" placeholder="Optional instructions for every chat"></textarea>
    </label>
    <label class="row">Temperature <span><input id="temp" type="range" min="0" max="1.5" step="0.05"> <b id="tempVal"></b></span></label>
    <label class="row">Max reply tokens <input id="maxTok" type="number" min="64" step="256" style="width:80px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:2px 6px"></label>
    <div id="status">connecting…</div>
  </div>
</aside>

<main>
  <div id="topbar"><button id="menu">☰</button><b>Uncensored Chat</b></div>
  <div id="log"><div class="wrap" id="msgs"></div></div>
  <div id="composer"><div class="wrap">
    <div id="box">
      <div id="attachments"></div>
      <textarea id="input" rows="1" placeholder="Message…  (Enter to send, Shift+Enter for a new line)"></textarea>
      <div id="actions">
        <button class="icon" id="attach" title="Attach image">🖼 Image</button>
        <button class="icon" id="think" title="Let the model reason before answering">💭 Think</button>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <span class="spacer"></span>
        <button id="send" disabled>Send</button>
      </div>
    </div>
    <div class="hint">Chats are stored only in this browser. Nothing is logged on the server.</div>
  </div></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let chats = store.get("chats", []);          // [{id, title, messages:[{role, content, images?, reasoning?, stats?}]}]
let currentId = store.get("current", null);
const settings = Object.assign({ system: "", temp: 0.7, maxTok: 4096, think: true }, store.get("settings", {}));
let pending = [];                            // data: URLs of images to send
let controller = null;

const save = () => { store.set("chats", chats); store.set("current", currentId); };
const saveSettings = () => store.set("settings", settings);
const current = () => chats.find((c) => c.id === currentId);

function md(text) {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text));
  const d = document.createElement("div"); d.textContent = text; return `<div style="white-space:pre-wrap">${d.innerHTML}</div>`;
}

/* ---------- sidebar ---------- */
function renderChats() {
  const list = $("chats"); list.innerHTML = "";
  for (const c of chats) {
    const el = document.createElement("div");
    el.className = "chat-item" + (c.id === currentId ? " active" : "");
    el.innerHTML = `<span></span><button title="Delete">✕</button>`;
    el.querySelector("span").textContent = c.title || "New chat";
    el.onclick = () => { currentId = c.id; save(); renderAll(); $("side").classList.remove("open"); };
    el.querySelector("button").onclick = (e) => {
      e.stopPropagation();
      if (!confirm("Delete this chat?")) return;
      chats = chats.filter((x) => x.id !== c.id);
      if (currentId === c.id) currentId = chats[0]?.id ?? null;
      save(); renderAll();
    };
    list.appendChild(el);
  }
}

/* ---------- messages ---------- */
function messageEl(m, i) {
  const el = document.createElement("div");
  el.className = "msg " + m.role;
  if (m.role === "user") {
    for (const src of m.images || []) { const img = new Image(); img.src = src; el.appendChild(img); }
    const b = document.createElement("div"); b.className = "bubble"; b.textContent = m.content; el.appendChild(b);
    return el;
  }
  if (m.reasoning) {
    const d = document.createElement("details"); d.className = "think";
    d.innerHTML = `<summary>Thought process</summary><div></div>`;
    d.querySelector("div").textContent = m.reasoning;
    el.appendChild(d);
  }
  const body = document.createElement("div"); body.className = "body";
  body.innerHTML = m.error ? `<p class="error"></p>` : md(m.content || "");
  if (m.error) body.firstChild.textContent = m.error;
  el.appendChild(body);
  const meta = document.createElement("div"); meta.className = "meta";
  if (m.stats) meta.append(Object.assign(document.createElement("span"), { textContent: m.stats }));
  const copy = Object.assign(document.createElement("button"), { textContent: "Copy" });
  copy.onclick = () => navigator.clipboard?.writeText(m.content || "").then(() => { copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1200); });
  meta.append(copy);
  const chat = current();
  if (chat && i === chat.messages.length - 1) {
    const regen = Object.assign(document.createElement("button"), { textContent: "Regenerate" });
    regen.onclick = () => { if (controller) return; chat.messages.pop(); save(); renderMessages(); generate(); };
    meta.append(regen);
  }
  el.appendChild(meta);
  return el;
}

function renderMessages() {
  const box = $("msgs"); box.innerHTML = "";
  const chat = current();
  if (!chat || !chat.messages.length) {
    box.innerHTML = `<div class="empty"><h1>Uncensored Chat</h1><p>Qwen3.6-27B Uncensored · runs entirely on your server</p></div>`;
    return;
  }
  chat.messages.forEach((m, i) => box.appendChild(messageEl(m, i)));
  scrollDown(true);
}

function scrollDown(force) {
  const log = $("log");
  if (force || log.scrollHeight - log.scrollTop - log.clientHeight < 120) log.scrollTop = log.scrollHeight;
}

function renderAll() { renderChats(); renderMessages(); }

/* ---------- sending ---------- */
function toApi(m) {
  if (m.role === "user" && m.images?.length) {
    return { role: "user", content: [
      ...m.images.map((url) => ({ type: "image_url", image_url: { url } })),
      { type: "text", text: m.content },
    ] };
  }
  return { role: m.role, content: m.content || "" };
}

async function send() {
  const text = $("input").value.trim();
  if ((!text && !pending.length) || controller) return;
  let chat = current();
  if (!chat) {
    chat = { id: Date.now().toString(36), title: "", messages: [] };
    chats.unshift(chat); currentId = chat.id;
  }
  if (!chat.title) chat.title = (text || "Image").slice(0, 48);
  chat.messages.push({ role: "user", content: text, images: pending });
  pending = []; renderAttachments();
  $("input").value = ""; autosize();
  // move the active chat to the top of the list
  chats = [chat, ...chats.filter((c) => c !== chat)];
  save(); renderAll();
  generate();
}

async function generate() {
  const chat = current();
  const reply = { role: "assistant", content: "", reasoning: "" };
  chat.messages.push(reply);
  const msgs = $("msgs");
  if (msgs.querySelector(".empty")) msgs.innerHTML = "";
  let el = messageEl(reply, -1); el.querySelector(".body").classList.add("cursor"); el.querySelector(".meta").hidden = true;
  msgs.appendChild(el); scrollDown(true);

  const history = chat.messages.slice(0, -1).map(toApi);
  if (settings.system.trim()) history.unshift({ role: "system", content: settings.system.trim() });

  controller = new AbortController();
  setBusy(true);
  const t0 = performance.now();
  let timings = null, lastPaint = 0;

  const paint = (final) => {
    const fresh = messageEl(reply, final ? chat.messages.length - 1 : -1);
    if (!final) { fresh.querySelector(".body").classList.add("cursor"); fresh.querySelector(".meta").hidden = true; }
    const open = el.querySelector("details.think")?.open;
    if (open || (!final && reply.reasoning && !reply.content)) fresh.querySelector("details.think")?.setAttribute("open", "");
    el.replaceWith(fresh); el = fresh; scrollDown();
  };

  try {
    const res = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        messages: history, stream: true,
        temperature: settings.temp, max_tokens: settings.maxTok,
        chat_template_kwargs: { enable_thinking: settings.think },
        timings_per_token: false,
      }),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({})))?.error?.message || `HTTP ${res.status}`);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ") || line === "data: [DONE]") continue;
        const j = JSON.parse(line.slice(6));
        const d = j.choices?.[0]?.delta || {};
        if (d.reasoning_content) reply.reasoning += d.reasoning_content;
        if (d.content) reply.content += d.content;
        if (j.timings) timings = j.timings;
      }
      if (performance.now() - lastPaint > 60) { paint(false); lastPaint = performance.now(); }
    }
  } catch (e) {
    if (e.name !== "AbortError") reply.error = "Error: " + e.message;
  }
  if (timings) reply.stats = `${timings.predicted_n} tokens · ${timings.predicted_per_second.toFixed(1)} tok/s`;
  else reply.stats = `${((performance.now() - t0) / 1000).toFixed(1)}s`;
  if (!reply.reasoning) delete reply.reasoning;
  controller = null; setBusy(false);
  save(); paint(true);
}

function setBusy(busy) {
  const b = $("send");
  b.textContent = busy ? "Stop" : "Send";
  b.classList.toggle("stop", busy);
  updateSend();
}
function updateSend() { $("send").disabled = !controller && !$("input").value.trim() && !pending.length; }

/* ---------- images ---------- */
function addFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    const r = new FileReader();
    r.onload = () => { pending.push(r.result); renderAttachments(); };
    r.readAsDataURL(f);
  }
}
function renderAttachments() {
  const a = $("attachments"); a.innerHTML = "";
  pending.forEach((src, i) => {
    const d = document.createElement("div");
    d.innerHTML = `<img><button title="Remove">✕</button>`;
    d.querySelector("img").src = src;
    d.querySelector("button").onclick = () => { pending.splice(i, 1); renderAttachments(); };
    a.appendChild(d);
  });
  updateSend();
}

/* ---------- wiring ---------- */
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; updateSend(); }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("input").addEventListener("paste", (e) => addFiles([...e.clipboardData.files]));
$("send").onclick = () => controller ? controller.abort() : send();
$("newChat").onclick = () => { currentId = null; save(); renderAll(); $("input").focus(); $("side").classList.remove("open"); };
$("attach").onclick = () => $("file").click();
$("file").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
$("menu").onclick = () => $("side").classList.toggle("open");
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { e.preventDefault(); addFiles([...e.dataTransfer.files]); });

$("system").value = settings.system;
$("system").oninput = () => { settings.system = $("system").value; saveSettings(); };
$("temp").value = settings.temp; $("tempVal").textContent = settings.temp;
$("temp").oninput = () => { settings.temp = +$("temp").value; $("tempVal").textContent = settings.temp; saveSettings(); };
$("maxTok").value = settings.maxTok;
$("maxTok").onchange = () => { settings.maxTok = Math.max(64, +$("maxTok").value || 4096); saveSettings(); };
const thinkBtn = $("think");
thinkBtn.classList.toggle("on", settings.think);
thinkBtn.onclick = () => { settings.think = !settings.think; thinkBtn.classList.toggle("on", settings.think); saveSettings(); };

fetch("/health").then((r) => {
  $("status").textContent = r.ok ? "model ready" : "model loading…";
  $("status").className = r.ok ? "ok" : "bad";
}).catch(() => { $("status").textContent = "server offline"; $("status").className = "bad"; });

if (!current()) currentId = null;
renderAll();
$("input").focus();
</script>
</body>
</html>
