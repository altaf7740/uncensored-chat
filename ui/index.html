<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uncensored Chat</title>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="side">
  <header><button id="newChat">+ New chat</button></header>
  <div id="chats"></div>
  <div id="settings">
    <label>System prompt
      <textarea id="system" placeholder="Optional instructions for every chat"></textarea>
    </label>
    <label class="row">Temperature <span><input id="temp" type="range" min="0" max="1.5" step="0.05"> <b id="tempVal"></b></span></label>
    <label class="row">Max reply tokens <input id="maxTok" type="number" min="64" step="256" ></label>
    <div id="status">connecting…</div>
  </div>
</aside>

<main>
  <div id="topbar"><button id="menu">☰</button><b>Uncensored Chat</b></div>
  <div id="log"><div class="wrap" id="msgs"></div></div>
  <div id="composer"><div class="wrap">
    <div id="box">
      <div id="attachments"></div>
      <textarea id="input" rows="1" placeholder="Message…  (Enter to send, Shift+Enter for a new line)"></textarea>
      <div id="actions">
        <button class="icon" id="attach" title="Attach image">🖼 Image</button>
        <button class="icon" id="think" title="Let the model reason before answering">💭 Think</button>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <span class="spacer"></span>
        <button id="send" disabled>Send</button>
      </div>
    </div>
    <div class="hint">Chats are stored only in this browser. Nothing is logged on the server.</div>
  </div></div>
</main>

<script src="app.js"></script>
</body>
</html>
